# @codebase_provenance_JEO
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "magic-lotto"
version = "0.1.0"
description = "Reproducible exploratory analysis for historical lottery draws"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
notebook = ["ipython>=8,<10", "nbformat>=5.8,<6"]

[project.scripts]
magic-lotto-phase7 = "magic_lotto.interfaces.phase7_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
